name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cubre client, server, shared y api del sitio, y la puerta api/ de la
      # raíz. api/ es lo que corre en Vercel: durante un tiempo quedó fuera del
      # typecheck y nadie se enteró.
      - name: Typecheck
        run: npx tsc --noEmit -p apps/sitio

      # Un @assets/ inexistente no lo detectan ni tsc ni vite build.
      - name: Assets
        run: npm run check:assets

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      # Los tests de toda la suite y la cobertura de la lógica (shared/,
      # client/src/lib/, server/) en una sola pasada. Falla si la cobertura
      # baja del umbral de vitest.config.ts (deuda 4.3). Lo que queda fuera es
      # verificación manual: npm run check:browser con el servidor levantado.
      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # La plataforma (apps/plataforma): typecheck, tests unitarios, tests de
  # integración contra un PostgreSQL 17 real, build y la imagen de Docker.
  plataforma:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aspal
          POSTGRES_PASSWORD: aspal_local
          POSTGRES_DB: aspal_prueba
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aspal -d aspal_prueba"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL_PRUEBA: postgres://aspal:aspal_local@localhost:5433/aspal_prueba
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check:plataforma

      - name: Tests unitarios
        run: npm run test:plataforma

      - name: Tests de integración
        run: npm run test:integracion

      - name: Build
        run: npm run build:plataforma

      - name: Imagen de Docker
        run: docker build -f apps/plataforma/Dockerfile -t aspal-plataforma .
