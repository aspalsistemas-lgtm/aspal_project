name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cubre client, server, shared y api. api/ es lo que corre en Vercel:
      # durante un tiempo quedó fuera del typecheck y nadie se enteró.
      - name: Typecheck
        run: npx tsc --noEmit

      # Un @assets/ inexistente no lo detectan ni tsc ni vite build.
      - name: Assets
        run: npm run check:assets

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      # Los tests de toda la suite y la cobertura de la lógica (shared/,
      # client/src/lib/, server/) en una sola pasada. Falla si la cobertura
      # baja del umbral de vitest.config.ts (deuda 4.3). Lo que queda fuera es
      # verificación manual: npm run check:browser con el servidor levantado.
      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build
