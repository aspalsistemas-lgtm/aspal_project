# Entorno local de la plataforma (decisión del 2026-10-14: todo se desarrolla en
# Docker y se mueve a la nube más adelante). Las credenciales son solo locales.
#
#   npm run db:levantar          solo PostgreSQL (y prepara los roles), para dev:plataforma
#   npm run plataforma:levantar  PostgreSQL + la plataforma en contenedor
#
# Puertos 5433 y 5010: el 5432 y el 5000-5001 los usa otro proyecto de la máquina.
name: aspal

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aspal
      POSTGRES_PASSWORD: aspal_local
      POSTGRES_DB: aspal
    ports:
      - "5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./apps/plataforma/docker/crear-base-prueba.sql:/docker-entrypoint-initdb.d/crear-base-prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspal -d aspal"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Una sola ejecución: crea los roles, ajusta privilegios y migra, con la URL de
  # administrador. La plataforma no arranca hasta que termina bien.
  migrador:
    build:
      context: .
      dockerfile: apps/plataforma/Dockerfile
    command:
      [
        "sh",
        "-c",
        "node apps/plataforma/dist/preparar-base.js && node apps/plataforma/dist/migrar.js",
      ]
    environment:
      DATABASE_URL_ADMIN: postgres://aspal:aspal_local@db:5432/aspal
      DATABASE_PASSWORD_APP: aspal_app_local
    depends_on:
      db:
        condition: service_healthy

  # Solo conoce la URL de aspal_app: sin superusuario ni BYPASSRLS, sujeta a RLS.
  plataforma:
    build:
      context: .
      dockerfile: apps/plataforma/Dockerfile
    environment:
      DATABASE_URL: postgres://aspal_app:aspal_app_local@db:5432/aspal
      DOMINIO_BASE: localhost
      PORT: "3000"
      # Acceso (plan del corte 3). Credenciales y secretos solo locales.
      SECRETO_CLAVES: secreto-local-de-desarrollo-no-usar-en-la-nube-0001
      ESQUEMA_PUBLICO: http
      PUERTO_PUBLICO: "5010"
      # Obligatorio en producción (la imagen usa NODE_ENV=production): 0 = sin proxy.
      TRUST_PROXY: "0"
      # Correo (corte 3b): Mailpit recoge todo; ver los mensajes en http://localhost:8025
      SMTP_HOST: correo
      SMTP_PORT: "1025"
      CORREO_REMITENTE: no-responder@aspal.localhost
    ports:
      - "5010:3000"
    depends_on:
      migrador:
        condition: service_completed_successfully
      correo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor SMTP de desarrollo: recibe los correos y los muestra en una web local.
  # No envía nada a internet. Puertos 1025 (SMTP) y 8025 (web).
  correo:
    image: axllent/mailpit:latest
    # Solo en esta máquina: cualquiera de la red leería los enlaces (tokens) de los correos.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  datos-postgres:
